[project]
name = "mirage-agent"
version = "0.1.0"
description = "LLM + RAG agent for automated Python library migration (Pydantic, SQLAlchemy, marshmallow)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "packaging>=24",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
    "filelock>=3.16",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
sandbox = ["docker>=7.0", "gitpython>=3.1"]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-python>=0.23",
]
codebase = ["tree-sitter>=0.23,<0.26", "tree-sitter-python>=0.23"]
dev = ["ruff>=0.5", "mypy>=1.10"]
cache = ["redis>=5.0"]

[project.urls]
Repository = "https://github.com/CiaCrystal/MirageAgent"

[project.scripts]
migration-agent = "migration_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # typer 的 Option/Argument 默认值就是函数调用
    "E501",  # 代码行宽交给 ruff format;中文 docstring 不受限
]
